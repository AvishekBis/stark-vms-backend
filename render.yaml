# Render Blueprint: backend web service (Docker). The database is Neon serverless PostgreSQL (ADR 0018,
# ADR 0016): Render's free PostgreSQL expires after about 30 days, Neon's does not, and Neon resumes on the
# first connection, so a link opened months later still works.
# Secrets marked "sync: false" are entered in the Render dashboard, never committed.
services:
  - type: web
    name: stark-vms-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Neon gives postgresql://USER:PASSWORD@HOST/neondb?sslmode=require. Spring needs the JDBC form without
      # the credentials: jdbc:postgresql://HOST:5432/neondb?sslmode=require, user and password separately.
      # Use the DIRECT host (no "-pooler"): Flyway needs a session-level connection. See README "Deploy".
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_STAFF_EMAIL
        sync: false
      - key: APP_STAFF_PASSWORD
        sync: false
      # v2.0 document storage: "database" (default, bytes in PostgreSQL, survives redeploys) or "supabase".
      - key: APP_STORAGE_PROVIDER
        value: database
      # Only needed when APP_STORAGE_PROVIDER=supabase (private bucket; the service key never leaves the server).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vehicle-documents
      # Object-path prefix in the bucket, so production files never mix with dev files in a shared bucket.
      - key: APP_STORAGE_KEY_PREFIX
        value: "prod/"

# No `databases:` block any more. The v2.0 deployment used a Render PostgreSQL instance (stark-vms-db) until
# 2026-11-10; it was replaced by Neon before Render's free database would have expired. Removing a resource
# from a Blueprint does not delete it on Render; the old instance simply expires on its own.
