# No secrets in this file: every environment-specific value comes from an environment variable
# (guideline 18.3). Local values live in application-local.yml (git-ignored) or in the
# embedded-PostgreSQL launcher under src/test (TestVmsApplication).
server:
  port: ${PORT:8080}
  # Client IP for the per-IP login limit (ADR 0022, amended after the security review, finding SEC-1): "native"
  # lets Tomcat's RemoteIpValve read X-Forwarded-For / X-Forwarded-Proto only when the TCP peer is a trusted
  # internal proxy (Spring Boot default: 10/8, 172.16/12, 192.168/16, 100.64/10, 169.254/16, loopback; override
  # with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES). It walks X-Forwarded-For from the right and takes the first
  # entry that is not such a proxy - the address Render's proxy appended - so client-added left-most entries and
  # the client-controlled RFC 7239 "Forwarded" header can no longer choose the IP key ("framework" trusted both).
  forward-headers-strategy: native
  # gzip for JSON pages (up to 100 rows); small bodies such as the login response stay as they are.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: stark-vms-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ""
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    admin-full-name: ${APP_ADMIN_FULL_NAME:Fleet Admin}
    staff-email: ${APP_STAFF_EMAIL:}
    staff-password: ${APP_STAFF_PASSWORD:}
    staff-full-name: ${APP_STAFF_FULL_NAME:Fleet Officer}
  # Login throttling (ADR 0022, contract 6.1): failed logins per e-mail / per client IP within the lockout
  # window lock that e-mail / IP for the lockout. In memory, per instance; reset by a restart.
  security:
    login:
      max-failures-per-email: ${APP_SECURITY_LOGIN_MAX_FAILURES_PER_EMAIL:5}
      max-failures-per-ip: ${APP_SECURITY_LOGIN_MAX_FAILURES_PER_IP:20}
      lockout: ${APP_SECURITY_LOGIN_LOCKOUT:15m}
  seed-demo-data: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

---
# Local development profile (no secrets here either): demo data and any localhost port for CORS,
# so `flutter run -d chrome` works whatever port Flutter picks.
spring:
  config:
    activate:
      on-profile: local

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:8081,http://localhost:3000}
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
  seed-demo-data: true
